<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>MALS</title>
<meta name="description" content="MALS — мессенджер со звонками и подарками за звёзды.">
<meta name="theme-color" content="#0f1013">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MALS">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ─────────────── вход / регистрация ─────────────── -->
<section id="screen-auth" class="screen auth" hidden>
  <div class="auth__glow"></div>
  <div class="auth__box">
    <div class="brand">
      <div class="brand__mark">✈</div>
      <h1 class="brand__name">MALS</h1>
      <p class="brand__tag">Сообщения, звонки и подарки — в одном месте</p>
    </div>

    <div class="segmented" role="tablist">
      <button class="segmented__item is-active" data-auth-tab="login" role="tab">Вход</button>
      <button class="segmented__item" data-auth-tab="register" role="tab">Регистрация</button>
    </div>

    <form id="auth-form" class="auth__form" autocomplete="on">
      <label class="field">
        <span class="field__label">Имя пользователя</span>
        <div class="field__wrap"><span class="field__prefix">@</span>
          <input name="username" class="field__input" placeholder="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
      </label>
      <label class="field" data-only="register" hidden>
        <span class="field__label">Отображаемое имя</span>
        <div class="field__wrap"><input name="displayName" class="field__input" placeholder="Как вас зовут"></div>
      </label>
      <label class="field">
        <span class="field__label">Пароль</span>
        <div class="field__wrap"><input name="password" type="password" class="field__input" placeholder="••••••••" required></div>
      </label>
      <p id="auth-error" class="form-error" hidden></p>
      <button class="btn btn--primary btn--lg" type="submit" id="auth-submit">Войти</button>
    </form>

    <p class="auth__hint">Демо-аккаунты после <code>npm run seed</code>: <b>alice</b> / <b>bob</b>, пароль <b>123456</b></p>
  </div>
</section>

<!-- ─────────────── основное приложение ─────────────── -->
<main id="screen-app" class="app" hidden>

  <!-- вкладка: чаты -->
  <section class="tab" data-tab="chats">
    <header class="topbar">
      <button class="avatar avatar--sm" id="open-own-profile"></button>
      <div class="topbar__title">
        <h2>Чаты</h2>
        <span class="topbar__sub" id="connection-status">подключение…</span>
      </div>
      <button class="chip chip--stars" id="open-wallet"><span class="chip__star">⭐</span><b id="balance-top">0</b></button>
    </header>
    <div class="searchbar">
      <input id="chat-search" class="searchbar__input" placeholder="Поиск по чатам" autocapitalize="none">
    </div>
    <div class="scroll" id="chat-list"></div>
    <button class="fab" id="new-chat" aria-label="Новый чат">
      <svg viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.83 2.83 0 0 0-4-4L4 16v4Z"/><path d="M13.5 6.5l4 4"/></svg>
    </button>
  </section>

  <!-- вкладка: подарки -->
  <section class="tab" data-tab="gifts" hidden>
    <header class="topbar">
      <div class="topbar__title"><h2>Подарки</h2><span class="topbar__sub">Дарите друзьям за звёзды</span></div>
      <button class="chip chip--stars" data-open-wallet><span class="chip__star">⭐</span><b class="balance-any">0</b></button>
    </header>
    <div class="scroll" id="gift-store"></div>
  </section>

  <!-- вкладка: профиль -->
  <section class="tab" data-tab="profile" hidden>
    <header class="topbar">
      <div class="topbar__title"><h2>Профиль</h2></div>
      <button class="icon-btn" id="logout" title="Выйти">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </header>
    <div class="scroll" id="profile-body"></div>
  </section>

  <!-- нижняя навигация -->
  <nav class="tabbar">
    <button class="tabbar__item is-active" data-goto="chats">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.5-4.6A8.4 8.4 0 0 1 3.6 11 8.4 8.4 0 0 1 12 2.6a8.4 8.4 0 0 1 9 8.4Z"/></svg>
      <span>Чаты</span><i class="tabbar__badge" id="tab-unread" hidden></i>
    </button>
    <button class="tabbar__item" data-goto="gifts">
      <svg viewBox="0 0 24 24"><path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8"/><path d="M2 7h20v5H2z"/><path d="M12 21V7"/><path d="M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7Z"/><path d="M12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7Z"/></svg>
      <span>Подарки</span>
    </button>
    <button class="tabbar__item" data-goto="profile">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Профиль</span>
    </button>
  </nav>
</main>

<!-- ─────────────── экран чата (поверх всего) ─────────────── -->
<section id="screen-chat" class="chat" hidden>
  <header class="chat__head">
    <button class="icon-btn" id="chat-back" aria-label="Назад">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="chat__peer" id="chat-peer">
      <span class="avatar avatar--sm" id="chat-avatar"></span>
      <span class="chat__peerText">
        <b id="chat-title">Чат</b>
        <i id="chat-status">был(а) недавно</i>
      </span>
    </button>
    <button class="icon-btn" id="call-audio" aria-label="Аудиозвонок">
      <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></svg>
    </button>
    <button class="icon-btn" id="call-video" aria-label="Видеозвонок">
      <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7Z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </button>
  </header>

  <div class="chat__scroll" id="message-list"></div>

  <div class="typing" id="typing-line" hidden><span></span><span></span><span></span><i>печатает…</i></div>

  <footer class="composer">
    <button class="icon-btn composer__gift" id="open-gift" aria-label="Подарок">
      <svg viewBox="0 0 24 24"><path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8"/><path d="M2 7h20v5H2z"/><path d="M12 21V7"/><path d="M12 7H7.5a2.5 2.5 0 1 1 0-5C11 2 12 7 12 7Z"/><path d="M12 7h4.5a2.5 2.5 0 1 0 0-5C13 2 12 7 12 7Z"/></svg>
    </button>
    <div class="composer__field">
      <textarea id="composer-input" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
    </div>
    <button class="send" id="composer-send" aria-label="Отправить">
      <svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
    </button>
  </footer>
</section>

<!-- ─────────────── звонок ─────────────── -->
<section id="call-overlay" class="call" hidden>
  <video id="call-remote-video" class="call__remote" autoplay playsinline></video>
  <video id="call-local-video" class="call__local" autoplay playsinline muted></video>
  <div class="call__body">
    <div class="avatar avatar--xl" id="call-avatar"></div>
    <h3 id="call-name">—</h3>
    <p id="call-state">Вызов…</p>
  </div>
  <div class="call__actions" id="call-actions"></div>
</section>

<!-- ─────────────── нижние шторки и уведомления ─────────────── -->
<div id="sheet-root"></div>
<div id="toasts" class="toasts"></div>

<audio id="ringtone" loop preload="auto"></audio>

<script type="module" src="/app.js"></script>
</body>
</html>
