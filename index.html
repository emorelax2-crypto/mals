<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Сергей Жирный</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<meta name="apple-mobile-web-app-title" content="Сергей Жирный">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Раннер в стиле динозаврика из Chrome с твоими фотографиями">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;overflow:hidden;position:fixed;overscroll-behavior:none;
    background:#f7f7f7;touch-action:none;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-touch-callout:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  #cv{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}

  .hud{
    position:absolute;top:0;left:0;right:0;z-index:20;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px);
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  }
  .hud .left{display:flex;gap:8px;pointer-events:auto}
  #score{
    font:700 clamp(13px,3.6vmin,20px)/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    letter-spacing:.09em;text-align:right;color:#535353;white-space:nowrap;
    transition:color .2s;
  }
  #score .hi{opacity:.55}
  #score.pop{color:#2e9b4f}
  body.night #score{color:#d9dbe6}
  body.night #score.pop{color:#7ee6a0}

  .btn{
    -webkit-appearance:none;appearance:none;border:2px solid #535353;background:rgba(255,255,255,.72);
    color:#535353;border-radius:999px;font:600 14px/1 inherit;padding:9px 13px;
    cursor:pointer;pointer-events:auto;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    transition:transform .08s ease, background .2s, color .2s, border-color .2s;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.93)}
  body.night .btn{border-color:#d9dbe6;color:#d9dbe6;background:rgba(18,24,48,.62)}
  .btn.icon{padding:9px 11px;font-size:16px}

  .overlay{
    position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:11px;text-align:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 52px) 16px calc(env(safe-area-inset-bottom) + 24px);
    color:#535353;background:rgba(247,247,247,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    animation:fade .25s ease;
  }
  body.night .overlay{color:#e6e8f2;background:rgba(9,13,30,.8)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay.hidden{display:none}
  .title{
    font:800 clamp(22px,6.4vmin,40px)/1.1 inherit;letter-spacing:.01em;text-wrap:balance;
    text-shadow:0 2px 0 rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.12);
  }
  body.night .title{text-shadow:0 2px 0 rgba(0,0,0,.4), 0 8px 28px rgba(120,160,255,.28)}
  .sub{font:600 clamp(14px,3.9vmin,20px)/1.45 inherit;opacity:.9}
  .tip{font:500 clamp(11px,3vmin,14px)/1.5 inherit;opacity:.6;max-width:28em}
  .stats{font:700 clamp(14px,4vmin,20px)/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.06em}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
  .btn.big{font-size:clamp(15px,4vmin,19px);padding:13px 24px;background:#535353;color:#f7f7f7}
  .btn.play{
    background:linear-gradient(180deg,#34b45c,#248a45);border-color:#1d7038;color:#fff;
    font-size:clamp(17px,4.6vmin,22px);padding:15px 38px;letter-spacing:.08em;
    box-shadow:0 6px 20px rgba(36,138,69,.38);
  }
  body.night .btn.play{background:linear-gradient(180deg,#3fd06a,#22a04f);border-color:#7ee6a0;color:#06210f}
  body.night .btn.big{background:#e6e8f2;color:#0b1022;border-color:#e6e8f2}
  .avatar{
    width:clamp(64px,17vmin,104px);height:clamp(64px,17vmin,104px);border-radius:50%;
    object-fit:cover;border:3px solid currentColor;box-shadow:0 6px 18px rgba(0,0,0,.16);
  }
  .pulse{animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.95;transform:translateY(0)}50%{opacity:.5;transform:translateY(-4px)}}
  /* --- выбор режима и сложности --- */
  .pickRow{display:flex;gap:6px;justify-content:center;width:min(94vw,400px)}
  .chip{
    -webkit-appearance:none;appearance:none;cursor:pointer;pointer-events:auto;
    border:2px solid currentColor;border-radius:13px;background:rgba(255,255,255,.5);
    color:inherit;padding:8px 9px;font:700 clamp(11px,3vmin,13px)/1.15 inherit;
    display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;flex:1 1 0;max-width:110px;
    transition:transform .1s, background .18s, border-color .18s;
  }
  body.night .chip{background:rgba(14,20,44,.5)}
  .chip:active{transform:scale(.94)}
  .chip .em{font-size:1.35em;line-height:1}
  .chip .sub{font-weight:600;font-size:.76em;opacity:.65}
  .chip[aria-pressed="true"]{background:#2e9b4f;border-color:#2e9b4f;color:#fff;box-shadow:0 4px 14px rgba(46,155,79,.35)}
  body.night .chip[aria-pressed="true"]{background:#49c46f;border-color:#49c46f;color:#07121f}
  .chip[aria-pressed="true"] .sub{opacity:.85}
  .rowLabel{font:700 clamp(10px,2.7vmin,12px)/1 inherit;letter-spacing:.14em;text-transform:uppercase;opacity:.5}

  #hearts{font-size:clamp(14px,3.8vmin,19px);line-height:1.1;letter-spacing:.06em;text-align:right;min-height:1.1em}
  #attempts{font:700 clamp(10px,2.8vmin,13px)/1.4 ui-monospace,Menlo,monospace;letter-spacing:.08em;
            text-align:right;opacity:.55;color:#535353}
  body.night #attempts{color:#d9dbe6}
  .hud .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none}

  /* --- ник, рейтинг, бонус --- */
  .field{display:flex;flex-direction:column;gap:6px;align-items:center;width:min(88vw,320px)}
  #nickInput{
    -webkit-appearance:none;appearance:none;width:100%;box-sizing:border-box;
    border:2px solid currentColor;background:rgba(255,255,255,.82);color:#3a3a3e;
    border-radius:14px;padding:13px 16px;text-align:center;letter-spacing:.04em;
    font:700 clamp(16px,4.4vmin,20px)/1.2 inherit;
  }
  body.night #nickInput{background:rgba(16,22,46,.75);color:#e6e8f2}
  #nickInput:focus{outline:3px solid rgba(46,155,79,.55);outline-offset:2px}
  .err{font:600 12px/1.4 inherit;color:#c0392b;min-height:1.3em}
  body.night .err{color:#ff8f80}

  .board{
    width:min(92vw,430px);max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    border:2px solid currentColor;border-radius:16px;background:rgba(255,255,255,.62);
  }
  body.night .board{background:rgba(10,16,38,.66)}
  .board table{width:100%;border-collapse:collapse;font:600 clamp(13px,3.6vmin,16px)/1.2 inherit}
  .board th,.board td{padding:10px 12px;text-align:left}
  .board th{font-size:.78em;text-transform:uppercase;letter-spacing:.08em;opacity:.65}
  .board td.pl{width:2.4em;opacity:.7;font-variant-numeric:tabular-nums}
  .board td.sc{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .board td.nk{word-break:break-word}
  .board tbody tr+tr{border-top:1px solid rgba(128,128,128,.22)}
  .board tr.me{background:rgba(46,155,79,.2)}
  .board .empty{padding:20px;opacity:.6;text-align:center}

  .bonusRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .bonusBtn{font-size:13px;padding:10px 14px}
  .bonusBtn[aria-pressed="true"]{background:#2e9b4f;border-color:#2e9b4f;color:#fff}
  body.night .bonusBtn[aria-pressed="true"]{background:#49c46f;border-color:#49c46f;color:#07121f}
  .lead{font:700 clamp(13px,3.5vmin,16px)/1.4 inherit;color:#2e9b4f}
  body.night .lead{color:#7ee6a0}

  #btnBonus{
    position:absolute;z-index:30;display:none;
    right:calc(env(safe-area-inset-right) + 16px);
    bottom:calc(env(safe-area-inset-bottom) + 24px);
    width:68px;height:68px;padding:0;border-radius:50%;
    align-items:center;justify-content:center;flex-direction:column;gap:1px;
    font-size:25px;border-width:3px;
  }
  #btnBonus.show{display:flex}
  #btnBonus.on{background:#2e9b4f;border-color:#2e9b4f;color:#fff}
  #btnBonus .left{font:800 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.02em}
  #file{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud">
  <div class="left">
    <button class="btn icon" id="btnSound" aria-label="Звук">🔊</button>
  </div>
  <div class="right">
    <div id="score"><span class="hi">HI 00000</span>&nbsp;&nbsp;00000</div>
    <div id="hearts"></div>
    <div id="attempts"></div>
  </div>
</div>

<button class="btn" id="btnBonus" aria-label="Использовать бонус"><span class="ic">🚀</span><span class="left"></span></button>

<div class="overlay" id="nickScreen">
  <div class="title">СЕРГЕЙ ЖИРНЫЙ</div>
  <div class="sub">Как тебя зовут?</div>
  <div class="field">
    <input id="nickInput" maxlength="12" placeholder="твой ник" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <div class="err" id="nickErr"></div>
  </div>
  <button class="btn big" id="btnNickOk">Продолжить</button>
  <div class="tip">Ник попадёт в таблицу рекордов</div>
</div>

<div class="overlay hidden" id="boardScreen">
  <div class="title">🏆 РЕЙТИНГ</div>
  <div class="board" id="boardBox"></div>
  <div class="tip" id="boardNote"></div>
  <button class="btn big" id="btnBoardClose">Назад</button>
</div>

<div class="overlay" id="startScreen">
  <img class="avatar" id="avaStart" alt="">
  <div class="title">СЕРГЕЙ ЖИРНЫЙ</div>
  <button class="btn play" id="btnPlay">▶ ИГРАТЬ</button>
  <div class="rowLabel">Режим</div>
  <div class="pickRow" id="modePick"></div>
  <div class="rowLabel">Сложность</div>
  <div class="pickRow" id="diffPick"></div>
  <div class="tip" id="modeTip"></div>
  <div class="tip" id="ctrlTip"></div>
  <div class="lead" id="leadBox" hidden></div>
  <div class="bonusRow" id="bonusPick" hidden>
    <button class="btn bonusBtn" data-bonus="jet"  aria-pressed="false">🚀 Джетпак</button>
    <button class="btn bonusBtn" data-bonus="high" aria-pressed="false">🦘 Выс. прыжок</button>
    <button class="btn bonusBtn" data-bonus="fast" aria-pressed="false">⚡ Скорость</button>
    <button class="btn bonusBtn" data-bonus="dbl"  aria-pressed="false">🔁 Двойной</button>
    <button class="btn bonusBtn" data-bonus="life" aria-pressed="false">❤️ 3 жизни</button>
  </div>
  <div class="row">
    <button class="btn" id="btnBoard1">🏆 Рейтинг</button>
    <button class="btn" id="btnNick">✏️ Ник</button>
  </div>
  <div class="row">
    <button class="btn" id="btnPhoto1">📷 Выбрать фото</button>
    <button class="btn" id="btnReset1" hidden>↺ Вернуть стандартное</button>
  </div>
</div>

<div class="overlay hidden" id="overScreen">
  <img class="avatar" id="avaOver" alt="">
  <div class="title">GAME OVER</div>
  <div class="stats" id="overStats">СЧЁТ 00000<br>РЕКОРД 00000</div>
  <div class="row">
    <button class="btn big" id="btnAgain">▶ Играть снова</button>
  </div>
  <div class="row">
    <button class="btn" id="btnBoard2">🏆 Рейтинг</button>
    <button class="btn" id="btnPhoto2">📷 Выбрать фото</button>
    <button class="btn" id="btnReset2" hidden>↺ Вернуть стандартное</button>
  </div>
  <div class="tip" id="newRec" hidden>🏆 Новый рекорд!</div>
</div>

<input type="file" id="file" accept="image/*">

const TAU = Math.PI * 2;
const clamp = (v,a,b) => v < a ? a : (v > b ? b : v);
const rnd = (a,b) => a + Math.random() * (b - a);
const ri  = (a,b) => Math.floor(rnd(a, b + 1));
const pad5 = n => String(Math.floor(n)).padStart(5, "0");

function rrSub(c, x, y, w, h, r){   // скруглённый прямоугольник как ПОДпуть (без beginPath)
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}
// вписать картинку в прямоугольник «по большей стороне», обрезав лишнее по центру
function drawCover(img, dx, dy, dw, dh, anchorY){
  const ir = img.width / img.height, dr = dw / dh;
  const ay = anchorY === undefined ? 0.5 : anchorY;
  let sx, sy, sw, sh;
  if (ir > dr){ sh = img.height; sw = sh * dr; sx = (img.width - sw) / 2; sy = 0; }
  else        { sw = img.width;  sh = sw / dr; sx = 0; sy = (img.height - sh) * ay; }
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
}
function rrect(c, x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}
function lerp(a,b,t){ return a + (b - a) * t; }
function mixRGB(c1, c2, t){
  return "rgb(" + Math.round(lerp(c1[0],c2[0],t)) + "," +
                  Math.round(lerp(c1[1],c2[1],t)) + "," +
                  Math.round(lerp(c1[2],c2[2],t)) + ")";
}
/* столкновение круг <-> прямоугольник */
function hitCircleRect(cx, cy, cr, rx, ry, rw, rh){
  const nx = clamp(cx, rx, rx + rw);
  const ny = clamp(cy, ry, ry + rh);
  const dx = cx - nx, dy = cy - ny;
  return dx*dx + dy*dy < cr*cr;
}

/* ---------- Звук (Web Audio API, без файлов) ---------- */
const Snd = {
  ctx:null, on: LS.get(K_SND,"1") === "1",
  init(){
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch(e){ this.ctx = null; }
  },
  tone(f0, f1, dur, type, vol){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  },
  jump(){ this.tone(420, 760, 0.13, "square", 0.13); },
  land(){ this.tone(180, 120, 0.06, "sine",   0.07); },
  point(){ this.tone(880, 880, 0.07, "square", 0.10);
           setTimeout(() => this.tone(1320, 1320, 0.10, "square", 0.10), 90); },
  die(){   this.tone(400, 300, 0.10, "square", 0.17);
           setTimeout(() => this.tone(260, 70, 0.42, "sawtooth", 0.17), 95); }
};
function syncSoundBtn(){ btnSound.textContent = Snd.on ? "🔊" : "🔇"; }

const Board = {
  MAX: 50,
  list(m){
    try {
      const v = JSON.parse(LS.get(boardKey(m || mode), "[]"));
      return Array.isArray(v) ? v.filter(r => r && typeof r.nick === "string" && isFinite(r.score)) : [];
    } catch(e){ return []; }
  },
  save(rows, m){ LS.set(boardKey(m || mode), JSON.stringify(rows.slice(0, this.MAX))); },
  /** Записывает результат, если он лучше прежнего. Возвращает true, если рекорд игрока обновился. */
  submit(name, sc, m){
    if (!name) return false;
    sc = Math.floor(sc);
    const rows = this.list(m);
    const key = name.toLowerCase();
    const i = rows.findIndex(r => r.nick.toLowerCase() === key);
    let better = true;
    if (i >= 0){
      if (sc <= rows[i].score) better = false;
      else rows[i] = { nick: name, score: sc, at: Date.now() };
    } else {
      rows.push({ nick: name, score: sc, at: Date.now() });
    }
    if (better){
      rows.sort((a, b) => b.score - a.score || a.at - b.at);
      this.save(rows, m);
    }
    return better;
  },
  rank(name, m){
    if (!name) return 0;
    const key = name.toLowerCase();
    const i = this.list(m).findIndex(r => r.nick.toLowerCase() === key);
    return i < 0 ? 0 : i + 1;
  },
  isFirst(name, m){ return this.rank(name, m) === 1; }
};

// «Выше» должно значить именно выше, а НЕ дольше: промежутки между кактусами
// рассчитаны под обычную дугу, и растянутый прыжок не даёт приземлиться вовремя.
// Поэтому вместе со скоростью в те же 1.6 раза усиливаем и гравитацию:
// высота = v^2/(2g) растёт в 1.6 раза, а время полёта = 2v/g остаётся прежним.
const HIGH_JUMP = 1.6;
const bonus = { kind: LS.get(K_BONUS, "jet"), armed: false, used: false, active: false, left: 0, thrust: false };
if (!BONUSES[bonus.kind]) bonus.kind = "jet";

/* ---------- Картинки ---------- */
const playerImg = new Image();
let playerReady = false;
playerImg.onload = () => { playerReady = true; };
playerImg.onerror = () => { playerReady = false; };

const birdImg = new Image();
let birdReady = false;
birdImg.onload = () => { birdReady = true; };
birdImg.src = BIRD_SRC;

const cactusImg = new Image();          // из этого фото сделаны кактусы
let cactusReady = false;
cactusImg.onload = () => { cactusReady = true; };
cactusImg.src = CACTUS_SRC;

const bgImg = new Image();              // фон — и днём, и ночью
let bgReady = false;
bgImg.onload = () => { bgReady = true; };
bgImg.src = BG_SRC;

function setPlayerSrc(src, custom){
  playerReady = false;
  playerImg.src = src;
  avaStart.src = src; avaOver.src = src;
  document.getElementById("btnReset1").hidden = !custom;
  document.getElementById("btnReset2").hidden = !custom;
}
setPlayerSrc(LS.get(K_IMG, DEFAULT_PLAYER), !!LS.get(K_IMG, null));

/* ---------- Размеры мира ---------- */
let W = 0, H = 0, DPR = 1, R = 28, groundY = 0, playerX = 0, S = 0;

function layout(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + "px";
  cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  S = Math.min(W, H);
  const prevGround = groundY;
  R = clamp(S * 0.09, 20, 50);
  groundY = H - Math.max(42, H * 0.16);
  playerX = Math.max(W * 0.13, R * 1.7);

  // масштабируем уже летящих птиц под новую землю
  if (prevGround > 0 && prevGround !== groundY){
    const d = groundY - prevGround;
    for (const o of obstacles) if (o.type === "bird") o.y += d;
  }
  buildStars();
  physics();
  geoPhysics();
}

/* ---------- Физика (всё привязано к радиусу игрока) ---------- */
let V0 = 0, G = 0, HOLD_G = 0, SPEED0 = 0, SPEEDMAX = 0;
function physics(){
  const HTAP = 2.55 * R;      // высота обычного прыжка
  const TUP  = 0.38;          // время до вершины
  V0 = 2 * HTAP / TUP;
  G  = V0 / TUP;
  HOLD_G = G * 0.5;           // пока держим палец — гравитация слабее
  SPEED0   = 8.8  * R * D().spd;
  SPEEDMAX = 19.0 * R * D().spd;
}
const HOLD_MAX = 0.34;        // сек, максимум «удержания»
const LIFT = 1.48;            // центр круга поднят над землёй на LIFT*R — под ним ноги

/* ---------- Состояние ---------- */
const MENU = 0, PLAY = 1, OVER = 2;
let state = MENU;

let py = 0, vy = 0, onGround = true, holding = false, holdT = 0;
let runT = 0, bodyAngle = 0;
let speed = 0, dist = 0, score = 0, hi = 0;
function loadHi(){ hi = parseInt(LS.get(hiKey(mode), "0"), 10) || 0; lastShown = -1; }
let obstacles = [], clouds = [], specks = [], stars = [];
let spawnIn = 0, nightPhase = 0, milestone = 0, overAt = 0, shake = 0;
let birdsUnlocked = false, wasNight = false;
let lives = 0, invuln = 0, airJumps = 0;

/* ---------- Частицы: пыль от прыжка, брызги от удара ---------- */
let parts = [];
function spawnParts(x, y, n, col, spd, up){
  if (parts.length > 220) parts.splice(0, parts.length - 220);
  for (let i = 0; i < n; i++){
    const a = up ? rnd(-Math.PI * 0.95, -Math.PI * 0.05) : rnd(0, TAU);
    const v = rnd(0.35, 1) * spd;
    parts.push({
      x: x, y: y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      r: rnd(R * 0.06, R * 0.16), life: 1, col: col
    });
  }
}
const burst = (x, y, n, col) => spawnParts(x, y, n, col, R * 9, false);
const puff  = (x, y, n, col) => spawnParts(x, y, n, col, R * 4, true);

function updateParts(dt){
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.vy += G * 0.35 * dt;
    p.x += (p.vx - speed * 0.25) * dt;
    p.y += p.vy * dt;
    p.life -= dt * 1.7;
    if (p.life <= 0 || p.x < -R) parts.splice(i, 1);
  }
}
function drawParts(){
  for (const p of parts){
    ctx.globalAlpha = clamp(p.life, 0, 1) * 0.9;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + p.life * 0.6), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---------- Фон ---------- */
function buildStars(){
  stars = [];
  const n = Math.round((W * H) / 14000);
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * (groundY * 0.92),
      r: rnd(0.6, 1.7),
      p: Math.random() * TAU,
      sp: rnd(0.4, 1.6)
    });
  }
}
function spawnCloud(x){
  clouds.push({ x: x, y: rnd(groundY * 0.08, groundY * 0.72), s: rnd(0.55, 1.25) });
}
function initBackground(){
  clouds = [];
  const n = clamp(Math.round((W * H) / 70000), 3, 8);
  for (let i = 0; i < n; i++) spawnCloud(Math.random() * W);
  specks = [];
  for (let i = 0; i < Math.round(W / 26) + 8; i++){
    specks.push({ x: Math.random() * W, o: rnd(2, 9), len: rnd(2, 10) });
  }
}

/* ---------- Препятствия ---------- */
function spawnCactusGroup(){
  const count = Math.random() < 0.55 ? 1 : (Math.random() < 0.72 ? 2 : 3);
  const items = [];
  let dx = 0;
  for (let i = 0; i < count; i++){
    const w = rnd(0.62, 1.05) * R;
    const h = rnd(1.15, 2.45) * R * D().size;
    items.push({
      dx: dx, w: w, h: h,
      armL: Math.random() < 0.55 && h > 1.45 * R,
      armR: Math.random() < 0.55 && h > 1.45 * R,
      armY: rnd(0.42, 0.62)
    });
    dx += w + rnd(0.16, 0.42) * R;
  }
  obstacles.push({ type:"cactus", x: W + R, items: items, w: dx });
}
function spawnBird(){
  // только две честные высоты: низко — перепрыгнуть, высоко — пробежать под ней
  // во время «высокого прыжка» игрок не управляет высотой, поэтому высоких птиц
  // в это время не выпускаем — иначе вынужденный прыжок через кактус убивает
  const low = (bonus.active && bonus.kind === "high") ? true : Math.random() < 0.5;
  const size = rnd(0.62, 0.8) * R;
  // Потолок обычного прыжка = LIFT + 2.55R + 0.76R = 4.79R над землёй.
  // Высокую птицу ставим выше него: тапом её не задеть никогда, даже если
  // прыгать пришлось из-за кактуса. Задеть можно только долгим нажатием — это уже выбор игрока.
  const y = low ? groundY - R * rnd(0.92, 1.18)
                : groundY - R * rnd(5.35, 5.90);
  obstacles.push({ type:"bird", x: W + R * 1.5, y: y, size: size, flap: Math.random() * TAU, low: low });
}
function scheduleSpawn(){
  // расстояние задаём во времени, чтобы сложность росла честно
  const t = clamp((speed - SPEED0) / (SPEEDMAX - SPEED0), 0, 1);
  const minT = lerp(0.92, 0.70, t) * D().gap;
  const maxT = lerp(1.85, 1.30, t) * D().gap;
  spawnIn = speed * rnd(minT, maxT);
}

/* ---------- Игровой цикл ---------- */
function reset(){
  obstacles = [];
  py = 0; vy = 0; onGround = true; holding = false; holdT = 0;
  runT = 0; bodyAngle = 0;
  speed = SPEED0; dist = 0; score = 0;
  milestone = 0; shake = 0; birdsUnlocked = false;
  lives = 0; invuln = 0; airJumps = 0; parts = [];
  geoSpin = 0; geoSpinTo = 0;
  if (mode === "geo"){ geoPhysics(); spawnIn = W * 0.55; }
  nightPhase = 0;
  initBackground();
  spawnIn = W * 0.75;
}

function startGame(){
  Snd.init();
  physics();
  reset();
  // бонус даётся только лидеру и только один раз за забег
  bonus.armed = Board.isFirst(nick);
  bonus.used = false; bonus.active = false; bonus.left = 0; bonus.thrust = false;
  // «3 жизни» не включают кнопкой — они выдаются сразу на весь забег
  if (bonus.armed && bonus.kind === "life"){ lives = 3; bonus.used = true; }
  attempts++;
  paintHud();
  paintBonus();
  state = PLAY;
  startEl.classList.add("hidden");
  overEl.classList.add("hidden");
  jump(); // первый тап сразу прыгает — приятнее
}

function gameOver(){
  state = OVER;
  overAt = performance.now();
  shake = 1;
  Snd.die();
  const sc = Math.floor(score);
  const isRec = sc > hi;
  if (isRec){ hi = sc; LS.set(hiKey(mode), String(hi)); }
  const improved = Board.submit(nick, sc);
  const place = Board.rank(nick);
  overStats.innerHTML = "СЧЁТ " + pad5(sc) + "<br>РЕКОРД " + pad5(hi) +
    (place ? "<br>МЕСТО " + place : "");
  newRecEl.hidden = !(isRec || improved);
  newRecEl.innerHTML = place === 1
    ? "🏆 Ты на 1 месте! Бонус разблокирован"
    : "🏆 Новый рекорд!";
  bonus.armed = false;
  btnBonus.classList.remove("show");
  overEl.classList.remove("hidden");
  if (navigator.vibrate) { try { navigator.vibrate(60); } catch(e){} }
}

function jump(){
  if (state !== PLAY) return;
  if (mode === "geo"){ geoJump(); return; }
  // в воздухе прыгать нельзя — кроме бонуса «Двойной», который даёт один добор
  const airAllowed = (bonus.active && bonus.kind === "dbl") ? 1 : 0;
  if (!onGround){
    if (airJumps >= airAllowed) return;
    airJumps++;
    puff(playerX, groundY - R * LIFT + py + R * 0.7, 10, "#8ad6a0");
  }
  vy = -V0 * (bonus.active && bonus.kind === "high" ? HIGH_JUMP : 1);
  onGround = false;
  holding = true;
  holdT = 0;
  Snd.jump();
}

function update(dt){
  runT += dt;

  /* --- бонус --- */
  if (bonus.active){
    bonus.left -= dt;
    if (bonus.left <= 0) stopBonus();
  }

  /* --- скорость и очки --- */
  const ramp = 1 - Math.exp(-score / 900);
  speed = SPEED0 + (SPEEDMAX - SPEED0) * ramp;
  let scoreMul = 1;
  // мир x1.3 уже сам ускоряет набор очков, поэтому множитель 2.3 -> итог примерно x3
  if (bonus.active && bonus.kind === "fast"){ speed *= 1.3; scoreMul = 2.3; }
  if (mode === "geo") speed = geoSpeed();   // geoSpeed уже учитывает бонус
  dist += speed * dt;
  score += dt * (speed / R) * 2.6 * scoreMul;

  if (score >= 500) birdsUnlocked = true;

  /* --- звук каждые 100 очков --- */
  const m = Math.floor(score / 100);
  if (m > milestone){
    milestone = m;
    Snd.point();
    scoreEl.classList.add("pop");
    setTimeout(() => scoreEl.classList.remove("pop"), 260);
  }

  /* --- день / ночь каждые 700 очков --- */
  const wantNight = (Math.floor(score / 700) % 2) === 1 ? 1 : 0;
  nightPhase += clamp(wantNight - nightPhase, -1, 1) * Math.min(1, dt * 1.3);
  if (Math.abs(wantNight - nightPhase) < 0.003) nightPhase = wantNight;
  const isNight = nightPhase > 0.5;
  if (isNight !== wasNight){
    wasNight = isNight;
    document.body.classList.toggle("night", isNight);
    const tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute("content", isNight ? "#0b1022" : "#f7f7f7");
  }

  physPlayer(dt);

  updateParts(dt);

  /* --- фон --- */
  for (const c of clouds){
    c.x -= speed * 0.28 * c.s * dt;
    if (c.x < -R * 4){ c.x = W + rnd(R * 2, W * 0.6); c.y = rnd(groundY * 0.08, groundY * 0.72); c.s = rnd(0.55, 1.25); }
  }
  for (const s of specks){
    s.x -= speed * dt;
    if (s.x < -12){ s.x = W + rnd(0, 60); s.o = rnd(2, 9); s.len = rnd(2, 10); }
  }

  obstStep(dt);
}

/* ---------- Физика игрока: у каждого режима своя ---------- */
function physPlayer(dt){ if (mode === "geo") physGeo(dt); else physRun(dt); }
function physRun(dt){
  /* --- прыжок --- */
  if (bonus.active && bonus.kind === "jet"){
    // джетпак: держишь палец — тяга вверх, отпустил — мягко падаешь
    vy += (bonus.thrust ? -G * 0.95 : G * 0.42) * dt;
    vy = clamp(vy, -V0 * 0.95, V0 * 0.8);
    py += vy * dt;
    const ceiling = -(groundY - R * LIFT - R * 1.1);   // не улетаем за верх экрана
    if (py < ceiling){ py = ceiling; if (vy < 0) vy = 0; }
    if (py >= 0){ py = 0; vy = 0; onGround = true; } else onGround = false;
    bodyAngle = clamp(vy / (V0 * 1.6), -0.4, 0.4) * -1;
  } else if (!onGround){
    holdT += dt;
    const g = (holding && vy < 0 && holdT < HOLD_MAX) ? HOLD_G : G;
    vy += g * (bonus.active && bonus.kind === "high" ? HIGH_JUMP : 1) * dt;
    py += vy * dt;
    bodyAngle = clamp(vy / (V0 * 1.8), -0.42, 0.42) * -1;
    if (py >= 0){
      py = 0; vy = 0; onGround = true; holding = false; airJumps = 0;
      puff(playerX, groundY, 7, "#b9b4a6");
      Snd.land();
    }
  } else {
    // «живой» бег: лёгкое покачивание и подпрыгивание
    const f = runT * (8 + speed / R);
    bodyAngle = Math.sin(f) * 0.15;
    py = -Math.abs(Math.sin(f)) * R * 0.09;
  }

}

/* ---------- Препятствия: у каждого режима свои ---------- */
function obstStep(dt){ if (mode === "geo") obstGeo(dt); else obstRun(dt); }
function obstRun(dt){
  /* --- появление препятствий --- */
  spawnIn -= speed * dt;
  if (spawnIn <= 0){
    let wasBird = false;
    if (birdsUnlocked && Math.random() < 0.3){ spawnBird(); wasBird = true; }
    else spawnCactusGroup();
    scheduleSpawn();
    // после птицы даём больше воздуха: нельзя ставить игрока между птицей и кактусом
    if (wasBird) spawnIn *= 1.3;
  }

  /* --- движение и столкновения --- */
  if (invuln > 0) invuln -= dt;
  const pcx = playerX;
  const pcy = groundY - R * LIFT + py;
  const pr  = R * 0.76;                   // хитбокс чуть меньше картинки

  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    if (o.type === "cactus"){
      o.x -= speed * dt;
      if (o.x + o.w < -R){ obstacles.splice(i, 1); continue; }
      let hit = false;
      if (invuln > 0) continue;
      for (const it of o.items){
        const bx = o.x + it.dx + it.w * 0.13;
        const bw = it.w * 0.74;
        const by = groundY - it.h + it.h * 0.06;
        const bh = it.h * 0.94;
        if (hitCircleRect(pcx, pcy, pr, bx, by, bw, bh)){ hit = true; break; }
      }
      if (hit){
        if (!survive(o.x + o.w * 0.5, groundY - R)){ gameOver(); return; }
        obstacles.splice(i, 1);
        continue;
      }
    } else {
      o.x -= speed * 1.22 * dt;
      o.flap += dt * 11;
      if (o.x < -R * 3){ obstacles.splice(i, 1); continue; }
      if (invuln > 0) continue;
      const dx = pcx - o.x, dy = pcy - o.y;
      const rr = pr + o.size * 0.74;
      if (dx*dx + dy*dy < rr*rr){
        if (!survive(o.x, o.y)){ gameOver(); return; }
        obstacles.splice(i, 1);
        continue;
      }
    }
  }
}

/* ==================== РЕЖИМ «ГЕОМЕТРИ» ====================
   Квадрат бежит сам, тап — прыжок с фиксированной дугой. Шипы убивают,
   на блоки можно запрыгнуть сверху, но удар в бок — смерть.
   py здесь — смещение НИЗА игрока от земли (0 на земле, меньше нуля в воздухе). */
let GS = 0, GV0 = 0, GG = 0, geoSpin = 0, geoSpinTo = 0, attempts = 0;

function geoPhysics(){
  GS  = R * 1.45;                       // сторона квадрата
  const apex = GS * 2.4, tUp = 0.31;    // дуга: хватает на 3 шипа подряд
  GV0 = 2 * apex / tUp;
  GG  = GV0 / tUp;
}

function geoSpeed(){ return GS * 7.5 * D().spd * (bonus.active && bonus.kind === "fast" ? 1.3 : 1); }
// Дуга прыжка фиксированная, поэтому размеры препятствий считаем от НЕЁ, а не от
// клетки: иначе на высокой скорости ступенька уезжает из-под ног и на неё не попасть.
const jumpDist = () => (2 * GV0 / GG) * geoSpeed();
const jumpApex = () => GS * 2.4;

function geoJump(){
  const airAllowed = (bonus.active && bonus.kind === "dbl") ? 1 : 0;
  if (!onGround){
    if (airJumps >= airAllowed) return;
    airJumps++;
    puff(playerX, groundY + py, 10, "#8ad6a0");
  }
  vy = -GV0 * (bonus.active && bonus.kind === "high" ? HIGH_JUMP : 1);
  onGround = false;
  geoSpinTo += Math.PI / 2;             // фирменный переворот
  Snd.jump();
}

/** Прямоугольник игрока (немного меньше картинки — так честнее). */
function geoBox(){
  const inset = GS * 0.12;
  return { x: playerX - GS / 2 + inset, y: groundY + py - GS + inset,
           w: GS - inset * 2, h: GS - inset * 2 };
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function physGeo(dt){
  const feetPrev = groundY + py;

  if (bonus.active && bonus.kind === "jet"){
    vy += (bonus.thrust ? -GG * 0.55 : GG * 0.3) * dt;
    vy = clamp(vy, -GV0 * 0.8, GV0 * 0.7);
  } else {
    vy += GG * (bonus.active && bonus.kind === "high" ? HIGH_JUMP : 1) * dt;
  }
  py += vy * dt;

  const ceiling = -(groundY - GS * 1.2);
  if (py < ceiling){ py = ceiling; if (vy < 0) vy = 0; }

  // ищем опору: земля или верх блока, который мы пересекли сверху вниз
  const feet = groundY + py;
  const bx0 = playerX - GS / 2, bx1 = playerX + GS / 2;
  let floor = groundY;
  for (const o of obstacles){
    if (o.type !== "block") continue;
    if (bx1 > o.x + GS * 0.1 && bx0 < o.x + o.w - GS * 0.1){
      if (feetPrev <= o.y + 2 && feet >= o.y) floor = Math.min(floor, o.y);
    }
  }
  if (feet >= floor){
    if (!onGround || Math.abs(vy) > 1) puff(playerX, floor, 6, "#b9b4a6");
    py = floor - groundY; vy = 0;
    if (!onGround){ onGround = true; airJumps = 0; geoSpin = geoSpinTo = Math.round(geoSpinTo / (Math.PI / 2)) * (Math.PI / 2); }
  } else {
    onGround = false;
  }

  // в воздухе квадрат докручивается к цели
  if (!onGround) geoSpin += (geoSpinTo - geoSpin) * Math.min(1, dt * 9) + dt * 3.2;
  bodyAngle = geoSpin;
}

function spawnGeo(){
  const JD = jumpDist(), JA = jumpApex();
  const sw = GS * 0.8, sh = GS * 0.85;
  const r = Math.random();

  if (r < 0.55 || diff === 0){
    // группа шипов: не шире 45% прыжка, иначе её не перелететь
    const want = diff === 0 ? 1 : ri(1, Math.min(3, 1 + diff));
    const fit  = Math.max(1, Math.floor(JD * 0.45 / (sw * 1.02)));
    const n = Math.min(want, fit);
    for (let i = 0; i < n; i++)
      obstacles.push({ type: "spike", x: W + i * sw * 1.02, w: sw, h: sh });

  } else if (r < 0.82){
    // одиночный блок: ниже 72% верхней точки прыжка (можно перелететь)
    // и шире 30% прыжка (можно приземлиться сверху)
    const bh = Math.min(JA * 0.72, GS * rnd(0.9, 1.5));
    const bw = Math.max(JD * 0.30, GS * 1.6);
    obstacles.push({ type: "block", x: W, y: groundY - bh, w: bw, h: bh });

  } else {
    // лесенка: две ступени, каждая достаточно широкая для посадки
    const stepW = Math.max(JD * 0.34, GS * 1.5);
    let x = W, bh = JA * 0.34;
    for (let i = 0; i < 2; i++){
      obstacles.push({ type: "block", x: x, y: groundY - bh, w: stepW, h: bh });
      x += stepW;
      bh = Math.min(JA * 0.72, bh + JA * 0.3);
    }
  }
  spawnIn = geoSpeed() * rnd(0.95, 1.7) * D().gap;
}

function obstGeo(dt){
  const v = geoSpeed();
  spawnIn -= v * dt;
  if (spawnIn <= 0) spawnGeo();

  if (invuln > 0) invuln -= dt;
  const box = geoBox();

  for (let i = obstacles.length - 1; i >= 0; i--){
    const o = obstacles[i];
    o.x -= v * dt;
    if (o.x + (o.w || GS) < -GS){ obstacles.splice(i, 1); continue; }
    if (invuln > 0) continue;

    let dead = false, cx = o.x, cy = groundY;
    if (o.type === "spike"){
      // прощаем края: опасна середина шипа
      const s = { x: o.x + o.w * 0.24, y: groundY - o.h * 0.82, w: o.w * 0.52, h: o.h * 0.82 };
      if (overlap(box, s)){ dead = true; cx = o.x + o.w / 2; cy = groundY - o.h / 2; }
    } else {
      // сверху мы уже стоим на блоке; значит любое пересечение — удар в бок
      if (overlap(box, o) && box.y + box.h > o.y + GS * 0.22){
        dead = true; cx = o.x; cy = o.y + o.h / 2;
      }
    }
    if (dead){
      if (!survive(cx, cy)){ gameOver(); return; }
      obstacles.splice(i, 1);
    }
  }
}

/* ---------- Отрисовка «Геометри» ---------- */
function drawGeo(ink){
  const danger = nightPhase > 0.5 ? "#ff6b6b" : "#e03e3e";
  for (const o of obstacles){
    if (o.type === "spike"){
      ctx.fillStyle = danger;
      ctx.beginPath();
      ctx.moveTo(o.x, groundY + 1);
      ctx.lineTo(o.x + o.w / 2, groundY - o.h);
      ctx.lineTo(o.x + o.w, groundY + 1);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.5, R * 0.05); ctx.stroke();
    } else {
      const rad = GS * 0.14;
      rrect(ctx, o.x, o.y, o.w, o.h, rad);
      ctx.lineWidth = Math.max(3, R * 0.13); ctx.strokeStyle = ink; ctx.lineJoin = "round"; ctx.stroke();
      ctx.save(); ctx.clip();
      if (cactusReady) drawCover(cactusImg, o.x, o.y, o.w, o.h);
      else { ctx.fillStyle = "#4a7c2f"; ctx.fill(); }
      ctx.restore();
    }
  }
}

function drawPlayerGeo(ink){
  const cx = playerX, cy = groundY + py - GS / 2;
  ctx.save();
  ctx.globalAlpha = 0.18; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(cx, groundY + 2, GS * 0.5, GS * 0.12, 0, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(bodyAngle);
  if (invuln > 0) ctx.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(runT * 18));
  const s = GS / 2, rad = GS * 0.18;
  rrect(ctx, -s, -s, GS, GS, rad);
  ctx.save(); ctx.clip();
  if (playerReady) ctx.drawImage(playerImg, -s, -s, GS, GS);
  else { ctx.fillStyle = ink; ctx.fill(); }
  ctx.restore();
  rrect(ctx, -s, -s, GS, GS, rad);
  ctx.lineWidth = Math.max(3, GS * 0.09); ctx.strokeStyle = ink; ctx.lineJoin = "round"; ctx.stroke();
  ctx.restore();
}

/* ---------- Отрисовка ---------- */
function drawCloud(c){
  const r = R * 0.5 * c.s;
  ctx.beginPath();
  ctx.arc(c.x,             c.y,             r,        0, TAU);
  ctx.arc(c.x + r * 1.05,  c.y + r * 0.18,  r * 0.78, 0, TAU);
  ctx.arc(c.x - r * 1.0,   c.y + r * 0.22,  r * 0.68, 0, TAU);
  ctx.arc(c.x + r * 0.15,  c.y - r * 0.45,  r * 0.66, 0, TAU);
  ctx.fill();
}

// силуэт кактуса (ствол + «руки») одним путём — им и обрезаем фото
function cactusPath(o, it){
  const x = o.x + it.dx, w = it.w, h = it.h;
  const tw = w * 0.58, tx = x + (w - tw) / 2;
  const aw = tw * 0.62, ay = groundY - h * it.armY, up = h * 0.30;
  ctx.beginPath();
  rrSub(ctx, tx, groundY - h, tw, h + 2, tw * 0.46);          // ствол
  if (it.armL){
    const ex = tx - w * 0.40;
    rrSub(ctx, ex, ay, (tx + tw * 0.5) - ex, aw, aw * 0.5);
    rrSub(ctx, ex, ay - up, aw, up + aw, aw * 0.5);
  }
  if (it.armR){
    const ay2 = ay + h * 0.10, ex = tx + tw + w * 0.40 - aw;
    rrSub(ctx, tx + tw * 0.5, ay2, (ex + aw) - (tx + tw * 0.5), aw, aw * 0.5);
    rrSub(ctx, ex, ay2 - up, aw, up + aw, aw * 0.5);
  }
}

function drawCactus(o, col, ink){
  for (const it of o.items){
    const x = o.x + it.dx, w = it.w, h = it.h;
    cactusPath(o, it);
    if (cactusReady){
      // обводку рисуем ДО фото: её внутренняя половина потом закрасится картинкой,
      // и стыки ствола с «руками» не видны — остаётся только внешний контур
      ctx.lineWidth = Math.max(3, R * 0.15);
      ctx.strokeStyle = ink;
      ctx.lineJoin = "round";
      ctx.stroke();
      ctx.save(); ctx.clip();
      drawCover(cactusImg, x - w * 0.19, groundY - h, w * 1.38, h);
      ctx.restore();
    } else {
      ctx.fillStyle = col; ctx.fill();
    }
  }
}

function drawBird(o, ink){
  const s = o.size;
  const wing = Math.sin(o.flap);
  ctx.save();
  ctx.translate(o.x, o.y);

  // крылья
  ctx.fillStyle = ink;
  for (const dir of [-1, 1]){
    ctx.save();
    ctx.scale(dir, 1);
    ctx.rotate(wing * 0.55 - 0.15);
    ctx.beginPath();
    ctx.moveTo(s * 0.55, -s * 0.05);
    ctx.quadraticCurveTo(s * 1.75, -s * 0.72, s * 2.15, -s * 0.05);
    ctx.quadraticCurveTo(s * 1.6,  s * 0.30,  s * 0.55, s * 0.24);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // фото-голова в круге
  ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU);
  if (birdReady){
    ctx.save(); ctx.clip();
    ctx.drawImage(birdImg, -s, -s, s * 2, s * 2);
    ctx.restore();
  } else {
    ctx.fillStyle = ink; ctx.fill();
  }
  ctx.lineWidth = Math.max(1.6, s * 0.11);
  ctx.strokeStyle = ink;
  ctx.beginPath(); ctx.arc(0, 0, s, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawPlayer(ink){
  const cy = groundY - R * LIFT + py;        // центр фото-круга
  const f  = runT * (8 + speed / R);

  // тень на земле
  const lift = clamp(-py / (R * 2.6), 0, 1);
  ctx.save();
  ctx.globalAlpha = 0.18 * (1 - lift * 0.75);
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.ellipse(playerX, groundY + R * 0.06, R * (0.72 - lift * 0.26), R * 0.15, 0, 0, TAU);
  ctx.fill();
  ctx.restore();

  // ноги (рисуем до круга, но они торчат ниже него)
  ctx.strokeStyle = ink;
  ctx.lineCap = "round";
  ctx.lineWidth = Math.max(2.5, R * 0.17);
  const hipY = cy + R * 0.66;
  const hipX = R * 0.36;
  if (onGround){
    // бег: ноги по очереди отрываются от земли (лицо смотрит на нас, поэтому шаг «вверх-вниз»)
    const la = Math.max(0, Math.sin(f)), rb = Math.max(0, Math.sin(f + Math.PI));
    ctx.beginPath();
    ctx.moveTo(playerX - hipX, hipY);
    ctx.lineTo(playerX - hipX + la * R * 0.14, groundY - R * 0.02 - la * R * 0.30);
    ctx.moveTo(playerX + hipX, hipY);
    ctx.lineTo(playerX + hipX + rb * R * 0.14, groundY - R * 0.02 - rb * R * 0.30);
    ctx.stroke();
  } else {
    // в прыжке ноги поджаты вперёд
    ctx.beginPath();
    ctx.moveTo(playerX - hipX, hipY); ctx.lineTo(playerX - hipX * 0.15, hipY + R * 0.64);
    ctx.moveTo(playerX + hipX, hipY); ctx.lineTo(playerX + hipX * 1.35, hipY + R * 0.46);
    ctx.stroke();
  }

  // фото в круге + обводка
  ctx.save();
  ctx.translate(playerX, cy);
  ctx.rotate(bodyAngle);
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU);
  if (playerReady){
    ctx.save(); ctx.clip();
    ctx.drawImage(playerImg, -R, -R, R * 2, R * 2);
    ctx.restore();
  } else {
    ctx.fillStyle = ink; ctx.fill();
  }
  ctx.lineWidth = Math.max(2, R * 0.095);
  ctx.strokeStyle = ink;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
  ctx.restore();
}

function render(){
  const t = nightPhase;
  const sky   = mixRGB(DAY.sky,   NIGHT.sky,   t);
  const ink   = mixRGB(DAY.ink,   NIGHT.ink,   t);
  const cac   = mixRGB(DAY.cac,   NIGHT.cac,   t);
  const cloud = mixRGB(DAY.cloud, NIGHT.cloud, t);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // фото-фон: одно и то же и днём, и ночью, сверху — «дымка» нужного цвета,
  // чтобы кактусы, земля и счёт оставались читаемыми
  if (bgReady){
    drawCover(bgImg, 0, 0, W, H, 0.38);   // держим лицо в кадре и в альбомной ориентации
    // в «Геометри» гасим фон сильнее: шипы и блоки должны читаться мгновенно
    ctx.globalAlpha = mode === "geo" ? lerp(0.80, 0.90, t) : lerp(0.58, 0.82, t);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  if (shake > 0){
    const s = shake * R * 0.22;
    ctx.translate(rnd(-s, s), rnd(-s, s));
  }

  // звёзды
  if (t > 0.02){
    ctx.fillStyle = "#fff";
    for (const st of stars){
      ctx.globalAlpha = t * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(runT * st.sp + st.p)));
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // луна
    ctx.globalAlpha = t;
    ctx.fillStyle = "#f2f3ea";
    const mx = W * 0.82, my = groundY * 0.22, mr = R * 0.72;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, TAU);                                          // диск
    ctx.arc(mx - mr * 0.42, my - mr * 0.22, mr * 0.92, TAU, 0, true);     // вычитаем «кусок»
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // облака
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = cloud;
  for (const c of clouds) drawCloud(c);
  ctx.globalAlpha = 1;

  // земля: в «Геометри» сплошная плита, в раннере — тонкая линия
  if (mode === "geo"){
    ctx.fillStyle = mixRGB([214, 208, 196], [24, 30, 56], t);
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.fillStyle = mixRGB([46, 155, 79], [126, 230, 160], t);
    ctx.fillRect(0, groundY - Math.max(2, R * 0.07), W, Math.max(3, R * 0.09));
  }
  ctx.strokeStyle = ink;
  ctx.lineWidth = Math.max(1.5, R * 0.065);
  ctx.beginPath();
  ctx.moveTo(0, groundY + 0.5);
  ctx.lineTo(W, groundY + 0.5);
  ctx.stroke();
  ctx.lineWidth = Math.max(1, R * 0.05);
  ctx.beginPath();
  for (const s of specks){
    ctx.moveTo(s.x, groundY + s.o);
    ctx.lineTo(s.x + s.len, groundY + s.o);
  }
  ctx.stroke();

  // препятствия
  if (mode === "geo"){
    drawGeo(ink);
  } else {
    for (const o of obstacles){
      if (o.type === "cactus") drawCactus(o, cac, ink);
      else drawBird(o, ink);
    }
  }

  if (mode === "geo") drawPlayerGeo(ink); else drawPlayer(ink);
  drawParts();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ---------- Счёт в HUD ---------- */
let lastShown = -1;
function paintScore(){
  const s = Math.floor(score);
  if (s === lastShown) return;
  lastShown = s;
  scoreEl.innerHTML = '<span class="hi">HI ' + pad5(hi) + "</span>&nbsp;&nbsp;" + pad5(s);
}

/* ---------- requestAnimationFrame ---------- */
let last = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1/25) dt = 1/25;          // страховка после сворачивания вкладки
  if (dt <= 0) return;

  if (state === PLAY) update(dt);
  else if (state === MENU){
    runT += dt;
    for (const c of clouds) c.x -= 14 * c.s * dt;
    if (clouds.length) for (const c of clouds) if (c.x < -R*4) c.x = W + rnd(0, W*0.4);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);

  render();
  paintScore();
  paintBonus();
  paintHud();
}

/* ---------- Экраны: ник, рейтинг, бонус ---------- */
const nickScreen = document.getElementById("nickScreen");
const boardScreen= document.getElementById("boardScreen");
const nickInput  = document.getElementById("nickInput");
const nickErr    = document.getElementById("nickErr");
const boardBox   = document.getElementById("boardBox");
const boardNote  = document.getElementById("boardNote");
const leadBox    = document.getElementById("leadBox");
const bonusPick  = document.getElementById("bonusPick");
const btnBonus   = document.getElementById("btnBonus");
const modePick   = document.getElementById("modePick");
const diffPick   = document.getElementById("diffPick");
const modeTip    = document.getElementById("modeTip");
const heartsEl   = document.getElementById("hearts");
const attemptsEl = document.getElementById("attempts");

/* --- чипы выбора режима и сложности --- */
function buildPickers(){
  modePick.innerHTML = Object.keys(MODES).map(k =>
    '<button class="chip" data-mode="' + k + '" aria-pressed="false">' +
    '<span class="em">' + MODES[k].icon + '</span>' + MODES[k].name + "</button>").join("");
  diffPick.innerHTML = DIFFS.map((d, i) =>
    '<button class="chip" data-diff="' + i + '" aria-pressed="false">' +
    '<span class="em">' + d.icon + '</span>' + d.name + "</button>").join("");
  for (const b of modePick.children)
    b.addEventListener("click", e => { e.stopPropagation(); setMode(b.dataset.mode); });
  for (const b of diffPick.children)
    b.addEventListener("click", e => { e.stopPropagation(); setDiff(+b.dataset.diff); });
}
const CTRL_TIP = {
  run: "Тап — прыжок · Долгое нажатие — выше<br>Прыгать можно только с земли",
  geo: "Тап — прыжок · Шипы убивают<br>На блоки можно запрыгнуть сверху"
};
function paintPickers(){
  for (const b of modePick.children) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  for (const b of diffPick.children) b.setAttribute("aria-pressed", String(+b.dataset.diff === diff));
  modeTip.textContent = MODES[mode].tip;
  const ct = document.getElementById("ctrlTip");
  if (ct) ct.innerHTML = CTRL_TIP[mode];
}
function setMode(m){
  if (!MODES[m] || m === mode) return;
  mode = m; LS.set(K_MODE, m);
  loadHi(); paintPickers(); refreshLeader(); paintScore();
}
function setDiff(i){
  diff = clamp(i, 0, DIFFS.length - 1); LS.set(K_DIFF, String(diff));
  physics(); geoPhysics(); paintPickers();
}

/* --- жизни и номер попытки в углу --- */
function paintHud(){
  heartsEl.textContent = lives > 0 ? "❤️".repeat(lives) : "";
  attemptsEl.textContent = (mode === "geo" && state !== MENU) ? "ПОПЫТКА " + attempts : "";
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

function renderBoard(){
  const rows = Board.list();
  if (!rows.length){
    boardBox.innerHTML = '<div class="empty">Пока никто не играл.<br>Твой рекорд будет первым!</div>';
  } else {
    const medal = ["🥇","🥈","🥉"];
    const key = nick.toLowerCase();
    boardBox.innerHTML =
      "<table><thead><tr><th>#</th><th>Ник</th><th class=\"sc\">Рекорд</th></tr></thead><tbody>" +
      rows.map((r, i) =>
        '<tr class="' + (r.nick.toLowerCase() === key ? "me" : "") + '">' +
          '<td class="pl">' + (medal[i] || (i + 1)) + "</td>" +
          '<td class="nk">' + esc(r.nick) + "</td>" +
          '<td class="sc">' + pad5(r.score) + "</td>" +
        "</tr>").join("") +
      "</tbody></table>";
  }
  boardNote.textContent = "Рекорды всех, кто играл на этом устройстве";
}

/** Показывает на стартовом экране блок выбора бонуса, если игрок на 1 месте. */
function refreshLeader(){
  const first = Board.isFirst(nick);
  leadBox.hidden = false;
  if (first){
    const B = BONUSES[bonus.kind] || BONUSES.jet;
    leadBox.textContent = "🏆 Ты на 1 месте в режиме «" + MODES[mode].name + "» — выбери бонус:";
    modeTip.textContent = B.icon + " " + B.name + " — " + B.tip;
    bonusPick.hidden = false;
  } else {
    const r = Board.rank(nick);
    leadBox.textContent = r ? "Ты на " + r + " месте. Займи 1-е — получишь бонус." 
                            : "Займи 1 место в рейтинге — получишь бонус.";
    bonusPick.hidden = true;
  }
  for (const b of bonusPick.querySelectorAll(".bonusBtn"))
    b.setAttribute("aria-pressed", String(b.dataset.bonus === bonus.kind));
}

function showNickScreen(){
  nickInput.value = nick;
  nickErr.textContent = "";
  nickScreen.classList.remove("hidden");
  startEl.classList.add("hidden");
  overEl.classList.add("hidden");
  setTimeout(() => nickInput.focus(), 60);
}
function saveNick(){
  const v = nickInput.value.trim().replace(/\s+/g, " ");
  if (v.length < 2){ nickErr.textContent = "Хотя бы 2 символа"; return; }
  if (v.length > 12){ nickErr.textContent = "Не длиннее 12 символов"; return; }
  nick = v;
  LS.set(K_NICK, nick);
  nickScreen.classList.add("hidden");
  startEl.classList.remove("hidden");
  refreshLeader();
}

/** Пережил ли игрок столкновение: бонус «Скорость» сносит препятствие, жизнь — тратится. */
function survive(x, y){
  if (bonus.active && bonus.kind === "fast"){
    score += 25;
    shake = Math.min(1, shake + 0.5);
    burst(x, y, 16, "#ffd34d");
    Snd.tone(220, 90, 0.10, "sawtooth", 0.12);
    return true;
  }
  if (lives > 0){
    lives--;
    invuln = 1.3;
    shake = 1;
    burst(x, y, 22, "#ff5b5b");
    Snd.tone(300, 140, 0.18, "square", 0.16);
    return true;
  }
  return false;
}

function startBonus(){
  if (!bonus.armed || bonus.used || bonus.active || state !== PLAY) return;
  bonus.active = true; bonus.used = true; bonus.left = BONUS_SEC; bonus.thrust = false;
  if (bonus.kind === "high"){
    // убираем высоких птиц, которые уже летят на игрока
    for (let i = obstacles.length - 1; i >= 0; i--){
      const o = obstacles[i];
      if (o.type === "bird" && !o.low && o.x > playerX - R) obstacles.splice(i, 1);
    }
  }
  Snd.point();
}
function stopBonus(){
  bonus.active = false; bonus.left = 0; bonus.thrust = false;
  if (!onGround && bonus.kind === "jet" && vy < 0) vy = 0;   // мягко переходим в падение
}
function paintBonus(){
  const B = BONUSES[bonus.kind];
  const show = state === PLAY && bonus.armed && B && B.timed && (!bonus.used || bonus.active);
  btnBonus.classList.toggle("show", show);
  if (!show) return;
  btnBonus.classList.toggle("on", bonus.active);
  const b = BONUSES[bonus.kind] || BONUSES.jet;
  btnBonus.querySelector(".ic").textContent = b.icon;
  btnBonus.querySelector(".left").textContent = bonus.active ? Math.ceil(bonus.left) + "с" : "";
}

/* ---------- Ввод ---------- */
function press(){
  Snd.init();
  if (state === MENU) { startGame(); return; }
  if (state === PLAY) {
    if (bonus.active && bonus.kind === "jet"){ bonus.thrust = true; return; }
    jump();
    return;
  }
  if (state === OVER && performance.now() - overAt > 450) startGame();
}
function release(){ holding = false; bonus.thrust = false; }

// тач / мышь через Pointer Events
window.addEventListener("pointerdown", e => {
  if (e.target.closest("button, input, label")) return;   // кнопки работают как кнопки
  e.preventDefault();
  press();
}, { passive:false });
window.addEventListener("pointerup",     release);
window.addEventListener("pointercancel", release);

// запасной путь для старых браузеров без Pointer Events
if (!window.PointerEvent){
  window.addEventListener("touchstart", e => {
    if (e.target.closest("button, input, label")) return;
    e.preventDefault(); press();
  }, { passive:false });
  window.addEventListener("touchend", release);
}

// блокируем прокрутку, зум и выделение
document.addEventListener("touchmove", e => {
  if (e.target.closest("button, input, label")) return;
  e.preventDefault();
}, { passive:false });
document.addEventListener("gesturestart",  e => e.preventDefault());
document.addEventListener("gesturechange", e => e.preventDefault());
document.addEventListener("dblclick",      e => e.preventDefault());
document.addEventListener("contextmenu",   e => e.preventDefault());

// клавиатура (для проверки на компьютере)
window.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter"){
    e.preventDefault();
    if (!e.repeat) press();
  }
});
window.addEventListener("keyup", e => {
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter") release();
});

/* ---------- Кнопки ---------- */
btnSound.addEventListener("click", e => {
  e.stopPropagation();
  Snd.on = !Snd.on;

nickInput.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); saveNick(); } });

for (const b of bonusPick.querySelectorAll(".bonusBtn")){

  });
}
btnBonus.addEventListener("click", e => { e.stopPropagation(); startBonus(); });
for (const id of ["btnPhoto1","btnPhoto2"]){
  document.getElementById(id).addEventListener("click", e => { e.stopPropagation(); fileInput.click(); });
}
for (const id of ["btnReset1","btnReset2"]){
  document.getElementById(id).addEventListener("click", e => {
    e.stopPropagation();
    LS.del(K_IMG);
    setPlayerSrc(DEFAULT_PLAYER, false);
  });
}

/* ---------- Загрузка фото из галереи ---------- */
fileInput.addEventListener("change", () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      // обрезаем по центру в квадрат и уменьшаем — чтобы влезло в localStorage
      const N = 256;
      const c = document.createElement("canvas");
      c.width = c.height = N;
      const g = c.getContext("2d");
      const side = Math.min(img.width, img.height);
      g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, N, N);
      let url;
      try { url = c.toDataURL("image/jpeg", 0.85); }
      catch(err){ url = String(fr.result); }        // если canvas «запятнан» — берём как есть
      setPlayerSrc(url, true);
      if (!LS.set(K_IMG, url)) alert("Фото применено, но сохранить его не удалось — после перезапуска вернётся стандартное.");
    };
    img.onerror = () => alert("Не удалось открыть это изображение.");
    img.src = String(fr.result);
  };
  fr.onerror = () => alert("Не удалось прочитать файл.");
  fr.readAsDataURL(f);
  fileInput.value = "";
});

/* ---------- Старт ---------- */
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", () => setTimeout(layout, 120));
if (window.visualViewport) window.visualViewport.addEventListener("resize", layout);
document.addEventListener("visibilitychange", () => { if (!document.hidden) last = 0; });

// офлайн-режим и установка на домашний экран
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

layout();
initBackground();

loadHi();
if (nick){ nickScreen.classList.add("hidden"); startEl.classList.remove("hidden"); }
else showNickScreen();
refreshLeader();
paintHud();
requestAnimationFrame(frame);
</script>
